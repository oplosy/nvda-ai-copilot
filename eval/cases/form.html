<!DOCTYPE html>
<html lang="tr"><head><title>Üyelik - TeknoMarket</title></head>
<body>
<form id="signup">
  <div class="row"><div>E-posta adresiniz</div><input id="email" type="text" required></div>
  <div class="error">Geçerli bir e-posta adresi girin</div>
  <div class="row"><div>Telefon</div><input id="phone" type="tel"></div>
  <div class="row"><div>Şifre (en az 8 karakter)</div><input id="pw" type="password" required></div>
  <div class="row"><input id="kvkk" type="checkbox" required><span>Aydınlatma metnini okudum</span></div>
  <div class="btn" role="button">Üye ol</div>
</form>
</body></html>
